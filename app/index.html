<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<title>个人工作台 · Personal Console</title>
<style>
/* ============================================================
   设计系统 — 克制的暖中性色，一条朱砂强调色
   ============================================================ */
:root{
  --paper:#F6F4EF;
  --paper-2:#FCFBF8;
  --ink:#232120;
  --ink-2:#4A4642;
  --ink-3:#8A8078;
  --ink-4:#B5ADA4;
  --line:#E4DED4;
  --line-2:#D6CFC2;
  --accent:#B0543C;
  --accent-soft:#C97A5F;
  --accent-wash:#F3E4DE;
  --pos:#4C7A5E;
  --pos-wash:#E3EDE5;
  --warn:#A8792C;
  --warn-wash:#F4EAD6;
  --neg:#A8483C;
  --neg-wash:#F5E2DE;
  --radius:3px;
  --radius-lg:5px;
  --shadow:0 1px 2px rgba(35,33,32,.045), 0 6px 20px -12px rgba(35,33,32,.13);
  --shadow-lift:0 2px 6px rgba(35,33,32,.06), 0 14px 34px -16px rgba(35,33,32,.20);
  --serif:"Songti SC","STSong","Noto Serif SC",ui-serif,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --rail:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:14px;
  line-height:1.6;
  font-feature-settings:"tnum" 1;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
/* 纸张质感：极淡的斜向织纹 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    repeating-linear-gradient(45deg, rgba(35,33,32,.012) 0 1px, transparent 1px 4px),
    radial-gradient(circle at 12% 0%, rgba(176,84,60,.045), transparent 42%),
    radial-gradient(circle at 92% 8%, rgba(76,122,94,.035), transparent 38%);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer;padding:0}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0}
ul{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-wash)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
/* 滚动条 */
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px;border:2px solid var(--paper)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}

.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-3)}
.tiny{font-size:11px}
.hide{display:none !important}

/* ============================================================
   布局：左侧轨 + 内容区
   ============================================================ */
#app{position:relative;z-index:1;min-height:100vh;min-height:100dvh}
.shell{display:flex;min-height:100vh;min-height:100dvh}

.rail{
  position:fixed;top:0;left:0;bottom:0;width:var(--rail);
  display:flex;flex-direction:column;align-items:center;
  padding:18px 0 14px;gap:4px;
  background:rgba(246,244,239,.86);
  backdrop-filter:saturate(1.4) blur(10px);
  border-right:1px solid var(--line);
  z-index:60;
}
.rail .brand{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;margin-bottom:14px;
  background:var(--ink);color:var(--paper-2);
  font-family:var(--serif);font-size:15px;font-weight:600;
  letter-spacing:0;flex:none;
}
.navbtn{
  position:relative;width:44px;height:42px;border-radius:var(--radius);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--ink-3);transition:color .16s, background .16s;
}
.navbtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.navbtn span{font-size:9.5px;letter-spacing:.02em;transform:scale(.94)}
.navbtn:hover{color:var(--ink);background:rgba(35,33,32,.045)}
.navbtn[aria-current="true"]{color:var(--accent)}
.navbtn[aria-current="true"]::before{
  content:"";position:absolute;left:-11px;top:50%;transform:translateY(-50%);
  width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--accent);
}
.rail .spacer{flex:1}
.rail .dot{
  width:6px;height:6px;border-radius:50%;background:var(--pos);margin-bottom:8px;
  box-shadow:0 0 0 3px var(--pos-wash);
}

.main{flex:1;min-width:0;margin-left:var(--rail);display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
  padding:22px 30px 14px;
  background:linear-gradient(180deg, var(--paper) 72%, rgba(246,244,239,.72) 100%);
  backdrop-filter:blur(6px);
}
.topbar .eyebrow{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-4);font-family:var(--mono)}
.topbar h1{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.015em;margin-top:3px}
.topbar h1 em{font-style:normal;color:var(--accent)}
.topbar .right{display:flex;align-items:center;gap:8px;flex:none;padding-bottom:3px}
.clock{text-align:right;line-height:1.25}
.clock b{font-family:var(--mono);font-size:16px;font-weight:500;letter-spacing:-.02em}
.clock i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3)}

.view{padding:0 30px 72px;flex:1}
.vhead{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.vhead .t{font-family:var(--serif);font-size:17px;font-weight:600}
.vhead .s{font-size:12px;color:var(--ink-3);margin-top:1px}

/* ============================================================
   基础元件
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:32px;padding:0 13px;border-radius:var(--radius);
  border:1px solid var(--line-2);background:var(--paper-2);color:var(--ink-2);
  font-size:12.5px;white-space:nowrap;transition:.15s;font-weight:500;
}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{border-color:var(--ink-4);color:var(--ink);background:#fff}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ink);color:var(--paper-2);border-color:var(--ink)}
.btn.primary:hover{background:#000;border-color:#000;color:#fff}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.accent:hover{background:#9C4834;border-color:#9C4834}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(35,33,32,.05);border-color:transparent}
.btn.danger:hover{border-color:var(--neg);color:var(--neg);background:var(--neg-wash)}
.btn.sm{height:26px;padding:0 9px;font-size:11.5px}
.btn.xs{height:23px;padding:0 7px;font-size:11px;gap:4px}
.btn.xs svg{width:12px;height:12px}
.btn.icon{width:30px;padding:0}
.btn.icon.sm{width:26px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}

.fld{
  width:100%;height:34px;padding:0 10px;border-radius:var(--radius);
  border:1px solid var(--line-2);background:var(--paper-2);
  font-size:13px;transition:.15s;
}
.fld:hover{border-color:var(--ink-4)}
.fld:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(176,84,60,.09)}
textarea.fld{height:auto;padding:8px 10px;line-height:1.55;resize:vertical;min-height:68px}
select.fld{
  appearance:none;padding-right:26px;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'%3E%3Cpath d='M2 4l3 3 3-3' fill='none' stroke='%238A8078' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 9px center;
}
.lab{display:block;font-size:11px;color:var(--ink-3);margin-bottom:5px;letter-spacing:.01em}
.field{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* 分段控件 */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;background:var(--paper-2);flex:none}
.seg button{
  padding:0 11px;height:30px;font-size:12px;color:var(--ink-3);
  border-right:1px solid var(--line);transition:.14s;white-space:nowrap;font-weight:500;
}
.seg button:last-child{border-right:none}
.seg button:hover{color:var(--ink);background:rgba(35,33,32,.035)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper-2)}
.seg.sm button{height:25px;padding:0 9px;font-size:11.5px}

/* 筛选胶囊 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  height:26px;padding:0 10px;border-radius:13px;
  border:1px solid var(--line-2);background:var(--paper-2);
  font-size:11.5px;color:var(--ink-2);transition:.14s;
}
.chip:hover{border-color:var(--ink-4)}
.chip[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent-soft);color:var(--accent);font-weight:500}
.chip .n{font-family:var(--mono);font-size:10px;opacity:.62}

/* 面板 */
.panel{
  background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px;box-shadow:var(--shadow);
}
.panel.pad0{padding:0}
.ptitle{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:14px;
}
.ptitle .l{display:flex;align-items:baseline;gap:8px;min-width:0}
.ptitle h3{font-size:13.5px;font-weight:600;letter-spacing:-.005em}
.ptitle .hint{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.rule{height:1px;background:var(--line);border:none;margin:14px 0}

/* 空态 */
.empty{
  padding:26px 16px;text-align:center;color:var(--ink-4);font-size:12.5px;
  border:1px dashed var(--line-2);border-radius:var(--radius);background:rgba(255,255,255,.4);
}
.empty b{display:block;color:var(--ink-3);font-weight:500;margin-bottom:3px;font-size:13px}

/* 数据展示 */
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0}
.kv .k{font-size:12px;color:var(--ink-3)}
.kv .v{font-family:var(--mono);font-size:13px;font-weight:500}
.big{font-family:var(--mono);font-weight:500;letter-spacing:-.03em;line-height:1}
.big.xl{font-size:40px}
.big.lg{font-size:28px}
.big.md{font-size:21px}

.tag{
  display:inline-flex;align-items:center;gap:4px;
  padding:1px 7px;border-radius:10px;font-size:10.5px;font-weight:500;
  background:var(--accent-wash);color:var(--accent);
}
.tag.pos{background:var(--pos-wash);color:var(--pos)}
.tag.warn{background:var(--warn-wash);color:var(--warn)}
.tag.neg{background:var(--neg-wash);color:var(--neg)}
.tag.plain{background:rgba(35,33,32,.06);color:var(--ink-3)}

.up{color:var(--pos)} .down{color:var(--neg)}

/* 进度条 */
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.thin{height:3px}
.bar>i.pos{background:var(--pos)} .bar>i.warn{background:var(--warn)} .bar>i.neg{background:var(--neg)}

/* ============================================================
   今日生活指数
   ============================================================ */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;margin-bottom:22px}
.score-panel{
  position:relative;overflow:hidden;
  background:var(--ink);color:#F2EEE8;border-color:var(--ink);
  border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-lift);
}
.score-panel::after{
  content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle, rgba(176,84,60,.42), transparent 68%);
}
.score-panel .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:relative}
.score-panel .says{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(242,238,232,.5);font-family:var(--mono)
}
.score-panel .ring{position:relative;flex:none;width:96px;height:96px}
.score-panel .ring svg{transform:rotate(-90deg);display:block}
.score-panel .ring .mid{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
}
.score-panel .ring .mid b{font-family:var(--mono);font-size:29px;font-weight:500;letter-spacing:-.04em;line-height:1;color:#fff}
.score-panel .ring .mid i{font-style:normal;font-size:9px;color:rgba(242,238,232,.5);letter-spacing:.1em}
.score-panel .desc{margin-top:16px;font-size:13px;color:rgba(242,238,232,.78);position:relative;max-width:38ch}
.score-panel .desc b{color:#fff;font-weight:600}
.dims{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;position:relative}
.dim{min-width:0}
.dim .r{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:4px}
.dim .r span{font-size:11px;color:rgba(242,238,232,.66)}
.dim .r b{font-family:var(--mono);font-size:11.5px;font-weight:500;color:#fff}
.dim .bar{background:rgba(242,238,232,.16)}
.dim .bar>i{background:rgba(242,238,232,.85)}

.brief{display:grid;grid-template-rows:auto 1fr;gap:16px}
.brief-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bcard{
  background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:14px;box-shadow:var(--shadow);min-width:0;
}
.bcard .k{font-size:10.5px;color:var(--ink-4);letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.bcard .v{margin-top:7px;font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.bcard .v small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px;letter-spacing:0}
.bcard .f{margin-top:6px;font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.bcard .f b{font-weight:500}
.bcard.accent{background:linear-gradient(160deg,var(--accent-wash),var(--paper-2) 70%);border-color:#E7CFC5}

.tiprow{
  display:flex;gap:9px;align-items:flex-start;
  padding:11px 13px;border-radius:var(--radius);
  background:rgba(255,255,255,.55);border:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);
}
.tiprow .ico{flex:none;width:16px;height:16px;margin-top:2px;color:var(--accent)}
.tiprow .ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tiprow b{font-weight:600;color:var(--ink)}

.quote{font-family:var(--serif);font-size:13.5px;color:var(--ink-2);line-height:1.75}
.quote::before{content:"「";color:var(--accent)}
.quote::after{content:"」";color:var(--accent)}

/* ============================================================
   记账
   ============================================================ */
.money-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stat{
  background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:14px 15px;box-shadow:var(--shadow);min-width:0;
}
.stat .k{font-size:11px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.stat .v{margin-top:7px;font-family:var(--mono);font-size:25px;font-weight:500;letter-spacing:-.03em;line-height:1}
.stat .v small{font-size:11.5px;color:var(--ink-4);margin-left:3px;font-weight:400;letter-spacing:0}
.stat .s{margin-top:7px;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.stat .bar{margin-top:9px}
.stat.hl{border-color:#E7CFC5;background:linear-gradient(165deg,var(--accent-wash),var(--paper-2) 62%)}

.money-body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar .grow{flex:1;min-width:120px}

.txlist{display:flex;flex-direction:column}
.txgroup{margin-bottom:6px}
.txdate{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 2px 6px;font-size:11px;color:var(--ink-3);font-family:var(--mono);
  border-bottom:1px solid var(--line);margin-bottom:2px;
}
.tx{
  display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:9px 6px 9px 2px;border-radius:var(--radius);transition:background .14s;
  border-bottom:1px solid rgba(228,222,212,.6);
}
.tx:last-child{border-bottom:none}
.tx:hover{background:rgba(35,33,32,.028)}
.tx .ci{
  width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:11px;font-weight:600;color:#fff;letter-spacing:-.02em;
}
.tx .mid{min-width:0}
.tx .mid .c{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tx .mid .m{font-size:11px;color:var(--ink-4);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .amt{font-family:var(--mono);font-size:13.5px;font-weight:500;text-align:right;white-space:nowrap}
.tx .amt.inc{color:var(--pos)}
.tx .del{opacity:0;transition:opacity .14s;color:var(--ink-4);margin-left:4px}
.tx:hover .del{opacity:1}
.tx .del:hover{color:var(--neg)}

/* 分类结构条 */
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line);margin:4px 0 14px}
.stack>i{height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.catlist{display:flex;flex-direction:column;gap:9px}
.catrow{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:9px;align-items:center}
.catrow .sw{width:8px;height:8px;border-radius:2px;flex:none}
.catrow .nm{font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.catrow .nm .sub{font-size:10.5px;color:var(--ink-4);font-family:var(--mono)}
.catrow .vl{font-family:var(--mono);font-size:12.5px;font-weight:500;white-space:nowrap}
.catrow .inner{min-width:0}
.catrow .bar{margin-top:4px}

/* 条形对比 */
.cmp{display:flex;align-items:flex-end;gap:9px;height:112px;padding-top:6px}
.cmp .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;min-width:0}
.cmp .bars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2.5px}
.cmp .b{width:9px;border-radius:2px 2px 0 0;transition:height .5s cubic-bezier(.2,.8,.2,1);min-height:2px}
.cmp .b.i{background:var(--pos)}
.cmp .b.o{background:var(--accent)}
.cmp .lb{font-size:10px;color:var(--ink-4);font-family:var(--mono);white-space:nowrap}
.legend{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

/* 预算 */
.budrow{padding:9px 0;border-bottom:1px solid rgba(228,222,212,.7)}
.budrow:last-child{border-bottom:none}
.budrow .t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.budrow .t .nm{font-size:12.5px;display:flex;align-items:center;gap:7px}
.budrow .t .v{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.budrow .t .v b{color:var(--ink);font-weight:500}
.budrow.over .t .v b{color:var(--neg)}

/* ============================================================
   习惯
   ============================================================ */
.habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.habit{
  background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:15px;box-shadow:var(--shadow);min-width:0;
}
.habit .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.habit .hd .nm{display:flex;align-items:center;gap:9px;min-width:0}
.habit .hd .emo{
  width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--accent-wash);color:var(--accent);font-size:14px;font-weight:600;
}
.habit .hd .nm h4{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.habit .hd .nm p{font-size:11px;color:var(--ink-4);font-family:var(--mono);margin-top:1px}
.habit .hd .acts{display:flex;gap:3px;flex:none}
.habit .hd .acts button{width:24px;height:24px;border-radius:var(--radius);display:grid;place-items:center;color:var(--ink-4)}
.habit .hd .acts button:hover{background:rgba(35,33,32,.06);color:var(--ink)}
.habit .hd .acts button.rm:hover{background:var(--neg-wash);color:var(--neg)}
.habit .hd .acts svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.streak{
  display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-family:var(--mono);
  padding:2px 8px;border-radius:11px;background:rgba(35,33,32,.055);color:var(--ink-3);
}
.streak.hot{background:var(--accent-wash);color:var(--accent)}
.streak svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.7}

.hmark{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.checkbtn{
  width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:1.5px solid var(--line-2);background:var(--paper-2);color:var(--ink-4);transition:.18s;
}
.checkbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.checkbtn:hover{border-color:var(--accent);color:var(--accent)}
.checkbtn[aria-pressed="true"]{background:var(--pos);border-color:var(--pos);color:#fff;box-shadow:0 0 0 4px var(--pos-wash)}
.hmark .info{min-width:0;flex:1}
.hmark .info .v{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.03em;line-height:1.15}
.hmark .info .v small{font-size:11px;color:var(--ink-4);font-weight:400;margin-left:2px;letter-spacing:0}
.hmark .info .s{font-size:11px;color:var(--ink-4);margin-top:2px}
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--line-2);border-radius:var(--radius);overflow:hidden;flex:none;background:var(--paper-2)}
.stepper button{width:32px;height:34px;display:grid;place-items:center;color:var(--ink-2);transition:.14s}
.stepper button:hover{background:rgba(35,33,32,.05);color:var(--ink)}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.stepper .cur{min-width:52px;text-align:center;font-family:var(--mono);font-size:15px;font-weight:500;border-left:1px solid var(--line);border-right:1px solid var(--line);height:34px;line-height:34px;padding:0 6px}
.numin{width:64px;height:34px;text-align:center;font-family:var(--mono);font-size:14px}
.quickadd{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}

.heat{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.heat .hdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.heat .hdr span{font-size:10.5px;color:var(--ink-4);letter-spacing:.05em;text-transform:uppercase;font-family:var(--mono)}
.heatgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:3px}
.heatgrid button{
  aspect-ratio:1;border-radius:2px;background:rgba(35,33,32,.055);
  transition:transform .12s, background .18s;position:relative;
}
.heatgrid button:hover{transform:scale(1.22);z-index:2}
.heatgrid button.l1{background:rgba(176,84,60,.24)}
.heatgrid button.l2{background:rgba(176,84,60,.45)}
.heatgrid button.l3{background:rgba(176,84,60,.68)}
.heatgrid button.l4{background:var(--accent)}
.heatgrid button.today{box-shadow:0 0 0 1.4px var(--ink);}
.heatgrid button.future{background:transparent;box-shadow:inset 0 0 0 1px rgba(35,33,32,.06)}
.heatlegend{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--ink-4);font-family:var(--mono)}
.heatlegend .sc{display:flex;align-items:center;gap:3px}
.heatlegend .sc i{width:9px;height:9px;border-radius:2px;display:block}

/* ============================================================
   健身
   ============================================================ */
.fit-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.fit-body{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.chartwrap{position:relative;width:100%}
.chartwrap svg{display:block;width:100%;height:auto;overflow:visible}
.chart-hint{display:flex;gap:14px;font-size:11px;color:var(--ink-3);margin-top:10px;flex-wrap:wrap}
.chart-hint i{display:inline-block;width:14px;height:2px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tipbox{
  position:absolute;pointer-events:none;z-index:5;
  background:var(--ink);color:#fff;border-radius:var(--radius);
  padding:6px 9px;font-size:11px;font-family:var(--mono);white-space:nowrap;
  box-shadow:0 6px 18px -6px rgba(0,0,0,.4);opacity:0;transition:opacity .12s;
}
.tipbox.on{opacity:1}
.fitgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wk{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);padding:12px;min-width:0}
.wk .d{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:9px}
.wk .d b{font-size:12px;font-weight:600}
.wk .d em{font-style:normal;font-size:10px;color:var(--ink-4);font-family:var(--mono)}
.wk .items{display:flex;flex-direction:column;gap:6px}
.wk .it{display:flex;align-items:center;gap:7px;font-size:12px;padding:5px 7px;border-radius:var(--radius);background:rgba(35,33,32,.032);transition:.14s}
.wk .it button.chk{
  width:14px;height:14px;border-radius:3px;border:1.4px solid var(--line-2);flex:none;
  display:grid;place-items:center;color:transparent;transition:.14s;
}
.wk .it button.chk svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.wk .it button.chk[aria-pressed="true"]{background:var(--pos);border-color:var(--pos);color:#fff}
.wk .it.done>span{text-decoration:line-through;color:var(--ink-4)}
.wk .it>span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk .it .x{opacity:0;color:var(--ink-4)}
.wk .it:hover .x{opacity:1}
.wk .it .x:hover{color:var(--neg)}
.wk.rest{background:transparent;border-style:dashed}
.wk.today{border-color:var(--accent);box-shadow:0 0 0 3px rgba(176,84,60,.07)}
.wk .hdr-add{width:100%;margin-top:7px;font-size:11px;color:var(--ink-4);border:1px dashed var(--line-2);border-radius:var(--radius);height:26px}
.wk .hdr-add:hover{color:var(--accent);border-color:var(--accent)}

/* ============================================================
   日程
   ============================================================ */
.sched-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.dcell{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);
  padding:9px 4px;text-align:center;transition:.15s;min-width:0;
}
.dcell:hover{border-color:var(--ink-4)}
.dcell[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper-2)}
.dcell .w{font-size:10px;color:var(--ink-4);font-family:var(--mono);letter-spacing:.04em}
.dcell[aria-pressed="true"] .w{color:rgba(242,238,232,.55)}
.dcell .d{font-family:var(--mono);font-size:16px;font-weight:500;margin-top:2px;letter-spacing:-.03em}
.dcell .cnt{display:flex;justify-content:center;gap:2.5px;margin-top:5px;height:5px;align-items:center}
.dcell .cnt i{width:4px;height:4px;border-radius:50%;background:var(--accent-soft);display:block}
.dcell[aria-pressed="true"] .cnt i{background:rgba(242,238,232,.75)}
.dcell.today .d{color:var(--accent)}
.dcell[aria-pressed="true"].today .d{color:var(--paper-2)}

.tl{position:relative;padding-left:0}
.tl .ev{
  display:grid;grid-template-columns:64px 3px minmax(0,1fr) auto;gap:12px;align-items:stretch;
  padding:0;border-radius:var(--radius);transition:background .14s;
}
.tl .ev:hover{background:rgba(35,33,32,.025)}
.tl .ev .tm{
  font-family:var(--mono);font-size:12px;color:var(--ink-3);padding:13px 0;text-align:right;
  letter-spacing:-.02em;
}
.tl .ev .tm b{display:block;color:var(--ink);font-weight:500;font-size:13px}
.tl .ev .tm.allday b{font-size:11.5px;color:var(--accent)}
.tl .ev .ln{background:var(--line);border-radius:2px;margin:9px 0;position:relative}
.tl .ev .ln::before{
  content:"";position:absolute;left:50%;top:4px;transform:translateX(-50%);
  width:7px;height:7px;border-radius:50%;background:var(--paper-2);border:2px solid var(--line-2);
}
.tl .ev.hi .ln::before{border-color:var(--accent);background:var(--accent)}
.tl .ev .bd{padding:11px 0;min-width:0}
.tl .ev .bd h4{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tl .ev .bd h4.done{text-decoration:line-through;color:var(--ink-4);font-weight:500}
.tl .ev .bd p{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.6;white-space:pre-wrap}
.tl .ev .bd .meta{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.tl .ev .op{display:flex;align-items:center;gap:4px;padding:11px 0;opacity:0;transition:opacity .14s}
.tl .ev:hover .op{opacity:1}
.tl .ev .op button{width:24px;height:24px;border-radius:var(--radius);display:grid;place-items:center;color:var(--ink-4)}
.tl .ev .op button:hover{background:rgba(35,33,32,.07);color:var(--ink)}
.tl .ev .op button.rm:hover{background:var(--neg-wash);color:var(--neg)}
.tl .ev .op svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ============================================================
   待买清单
   ============================================================ */
.want-top{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.wantlist{display:flex;flex-direction:column;gap:8px}
.want{
  display:grid;grid-template-columns:15px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper-2);
  transition:.15s;
}
.want:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.want .chk{
  width:15px;height:15px;border-radius:3px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;color:transparent;transition:.15s;flex:none;
}
.want .chk svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.want .chk:hover{border-color:var(--pos)}
.want .chk[aria-pressed="true"]{background:var(--pos);border-color:var(--pos);color:#fff}
.want .mid{min-width:0}
.want .mid .n{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.want .mid .n.done{text-decoration:line-through;color:var(--ink-4);font-weight:400}
.want .mid .d{font-size:11px;color:var(--ink-4);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.want .mid .d span{display:inline-flex;align-items:center;gap:3px}
.want .r{display:flex;align-items:center;gap:10px;flex:none}
.want .price{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap}
.want .pri{width:6px;height:6px;border-radius:50%;flex:none}
.want .pri.p1{background:var(--neg)} .want .pri.p2{background:var(--warn)} .want .pri.p3{background:var(--ink-4)}
.want .acts{display:flex;gap:3px;opacity:0;transition:opacity .14s}
.want:hover .acts{opacity:1}
.want .acts button{width:24px;height:24px;border-radius:var(--radius);display:grid;place-items:center;color:var(--ink-4)}
.want .acts button:hover{background:rgba(35,33,32,.07);color:var(--ink)}
.want .acts button.rm:hover{background:var(--neg-wash);color:var(--neg)}
.want .acts svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.want.bought{opacity:.6;background:rgba(255,255,255,.5)}

/* ============================================================
   书影音
   ============================================================ */
.media-top{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.scrollwall{
  display:flex;gap:16px;overflow-x:auto;padding:4px 2px 16px;
  scroll-snap-type:x proximity;
}
.poster{
  flex:none;width:120px;scroll-snap-align:start;
}
.poster .ph{
  position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--radius);
  overflow:hidden;background:var(--line);box-shadow:var(--shadow);
  transition:transform .2s, box-shadow .2s;
}
.poster:hover .ph{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.poster .ph img{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph .ph-fallback{
  position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;
  padding:11px 10px;
}
.poster .ph .ph-fallback .tt{font-family:var(--serif);font-size:13.5px;font-weight:600;line-height:1.35;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.28)}
.poster .ph .ph-fallback .bt{font-size:9.5px;font-family:var(--mono);color:rgba(255,255,255,.8);letter-spacing:.08em;text-transform:uppercase}
.poster .ph .st{
  position:absolute;top:7px;left:7px;padding:2px 7px;border-radius:9px;
  font-size:9.5px;font-weight:600;background:rgba(255,255,255,.93);color:var(--ink);
  backdrop-filter:blur(4px);
}
.poster .ph .st.done{background:rgba(35,33,32,.85);color:#fff}
.poster .ph .st.doing{background:rgba(176,84,60,.92);color:#fff}
.poster .ph .rate{
  position:absolute;bottom:7px;left:7px;display:flex;gap:1.5px;
}
.poster .ph .rate svg{width:11px;height:11px;fill:rgba(255,255,255,.95);stroke:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.poster .meta{padding:8px 2px 0}
.poster .meta .t{font-size:12.5px;font-weight:500;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.poster .meta .s{font-size:10.5px;color:var(--ink-4);margin-top:2px;display:flex;align-items:center;gap:5px}
.poster .acts{display:flex;gap:4px;margin-top:7px;opacity:0;transition:opacity .15s}
.poster:hover .acts{opacity:1}
.poster .acts button{flex:1;height:23px;border:1px solid var(--line-2);border-radius:var(--radius);font-size:10.5px;color:var(--ink-3);display:grid;place-items:center;background:var(--paper-2)}
.poster .acts button:hover{color:var(--ink);border-color:var(--ink-4)}
.poster .acts button.rm:hover{color:var(--neg);border-color:var(--neg);background:var(--neg-wash)}
.poster .acts svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.medlist{display:flex;flex-direction:column}
.mrow{
  display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:13px;align-items:center;
  padding:11px 8px;border-radius:var(--radius);border-bottom:1px solid rgba(228,222,212,.65);
  transition:background .14s;
}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:rgba(35,33,32,.025)}
.mrow .th{
  width:40px;height:56px;border-radius:2px;overflow:hidden;background:var(--line);flex:none;
  display:grid;place-items:center;
}
.mrow .th img{width:100%;height:100%;object-fit:cover;display:block}
.mrow .th span{font-family:var(--serif);font-size:15px;color:rgba(255,255,255,.95);font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.mrow .mid{min-width:0}
.mrow .mid .t{font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.mrow .mid .t .yr{font-family:var(--mono);font-size:11px;color:var(--ink-4);font-weight:400}
.mrow .mid .c{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mrow .mid .m{font-size:10.5px;color:var(--ink-4);margin-top:4px;font-family:var(--mono);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mrow .r{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none}
.mrow .r .stars{display:flex;gap:2px}
.mrow .r .stars svg{width:12px;height:12px}
.mrow .r .acts{display:flex;gap:4px;opacity:0;transition:opacity .14s}
.mrow:hover .r .acts{opacity:1}
.mrow .r .acts button{width:24px;height:24px;border-radius:var(--radius);display:grid;place-items:center;color:var(--ink-4)}
.mrow .r .acts button:hover{background:rgba(35,33,32,.07);color:var(--ink)}
.mrow .r .acts button.rm:hover{background:var(--neg-wash);color:var(--neg)}
.mrow .r .acts svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.sr{display:inline-flex;gap:1.5px;align-items:center}
.sr svg{width:13px;height:13px}
.sr svg path{fill:none}
.sr svg.on path{fill:var(--warn);stroke:var(--warn)}
.sr svg.off path{stroke:var(--line-2);fill:none}
.sr.lg svg{width:17px;height:17px}
.yearstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px}
.ystat{text-align:center;padding:12px 8px;border-radius:var(--radius);background:rgba(35,33,32,.028)}
.ystat .v{font-family:var(--mono);font-size:22px;font-weight:500;letter-spacing:-.03em}
.ystat .k{font-size:10.5px;color:var(--ink-3);margin-top:3px}

/* ============================================================
   弹窗
   ============================================================ */
.mask{
  position:fixed;inset:0;z-index:200;background:rgba(35,33,32,.42);
  backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.mask.on{opacity:1;pointer-events:auto}
.dlg{
  width:100%;max-width:480px;max-height:90vh;overflow:auto;
  background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--radius-lg);
  box-shadow:0 28px 70px -20px rgba(35,33,32,.42);
  transform:translateY(10px) scale(.985);transition:transform .22s cubic-bezier(.2,.8,.2,1);
}
.mask.on .dlg{transform:none}
.dlg.wide{max-width:620px}
.dlg .dh{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 20px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--paper-2);z-index:2;
}
.dlg .dh h3{font-size:15px;font-family:var(--serif);font-weight:600}
.dlg .dh p{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.dlg .db{padding:18px 20px}
.dlg .df{
  display:flex;align-items:center;justify-content:flex-end;gap:8px;
  padding:14px 20px;border-top:1px solid var(--line);
  position:sticky;bottom:0;background:var(--paper-2);
}
.dlg .df .l{margin-right:auto;font-size:11.5px;color:var(--ink-3)}
.closebtn{width:30px;height:30px;border-radius:var(--radius);display:grid;place-items:center;color:var(--ink-3);flex:none}
.closebtn:hover{background:rgba(35,33,32,.06);color:var(--ink)}
.closebtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round}
.frow{margin-bottom:13px}
.seg-full{display:flex;width:100%}
.seg-full button{flex:1;justify-content:center}

/* ============================================================
   Toast / 横幅
   ============================================================ */
#toasts{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;
  pointer-events:none;width:calc(100% - 32px);max-width:420px;
}
.toast{
  display:flex;align-items:center;gap:9px;width:100%;
  padding:11px 15px;border-radius:var(--radius);
  background:var(--ink);color:#F2EEE8;font-size:12.5px;
  box-shadow:0 14px 34px -12px rgba(0,0,0,.5);
  animation:tin .26s cubic-bezier(.2,.8,.2,1);
  pointer-events:auto;
}
.toast svg{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.toast.ok svg{color:#8FC5A0}
.toast.warn{background:#8A6420}
.toast.err{background:#8E3A2F}
.toast .x{margin-left:auto;opacity:.5;font-size:15px;line-height:1}
.toast .x:hover{opacity:1}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(8px) scale(.98)}}

#banners{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.banner{
  display:flex;align-items:flex-start;gap:11px;padding:13px 15px;
  border-radius:var(--radius);border:1px solid;font-size:12.5px;
}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.banner .bd{flex:1;min-width:0}
.banner .bd b{display:block;font-size:13px;margin-bottom:2px;font-weight:600}
.banner .bd p{color:var(--ink-2);line-height:1.6}
.banner .ba{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.banner.warn{background:var(--warn-wash);border-color:#E3D2AE;color:var(--warn)}
.banner.warn .bd p{color:#7A5A1B}
.banner.err{background:var(--neg-wash);border-color:#E8C7C0;color:var(--neg)}
.banner.err .bd p{color:#8A3A30}
.banner.info{background:var(--pos-wash);border-color:#C9DCCE;color:var(--pos)}
.banner.info .bd p{color:#3C6349}

/* ============================================================
   底部移动端导航
   ============================================================ */
.tabbar{display:none}
@media (max-width:860px){
  .tabbar{
    display:flex;
    position:fixed;left:0;right:0;bottom:0;z-index:80;
    background:rgba(252,251,248,.94);backdrop-filter:blur(14px) saturate(1.5);
    border-top:1px solid var(--line);
    padding:7px 2px calc(7px + env(safe-area-inset-bottom));
  }
  .tabbar button{
    flex:1;min-width:0;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 1px;color:var(--ink-3);font-size:9.5px;transition:.15s;
  }
  .tabbar button span{transform:scale(.94);white-space:nowrap}
  .tabbar button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .tabbar button[aria-current="true"]{color:var(--accent)}
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width:1180px){
  .hero{grid-template-columns:1fr}
  .money-body,.fit-body,.sched-body{grid-template-columns:1fr}
  .money-top,.fit-top{grid-template-columns:repeat(2,minmax(0,1fr))}
  .media-top{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  :root{--rail:0px}
  .rail{display:none}
  .main{margin-left:0}
  .topbar{padding:16px 16px 10px;align-items:center}
  .topbar h1{font-size:19px}
  .topbar .eyebrow{font-size:9.5px}
  .clock b{font-size:14px}
  .view{padding:0 16px calc(84px + env(safe-area-inset-bottom))}
  .panel{padding:15px}
  .score-panel{padding:18px}
  .big.xl{font-size:34px}
  .habits{grid-template-columns:1fr}
  .want-top{grid-template-columns:1fr;gap:10px}
  .want-top .stat{display:none}
  .want-top .stat:first-child{display:block}
  .tl .ev{grid-template-columns:52px 3px minmax(0,1fr);gap:9px}
  .tl .ev .op{grid-column:3;padding:0 0 10px;opacity:1;justify-content:flex-end}
  .dlg{max-height:94vh}
  .mask{padding:12px;align-items:flex-end}
  .dlg{max-width:100%}
  #toasts{bottom:82px}
  .heatgrid{grid-template-columns:repeat(15,1fr)}
  .media-top{grid-template-columns:1fr 1fr;gap:10px}
  .poster{width:104px}
  .mrow{grid-template-columns:34px minmax(0,1fr) auto;gap:10px}
  .mrow .th{width:34px;height:48px}
}
@media (max-width:560px){
  .score-panel .ring{width:82px;height:82px}
  .score-panel .ring .mid b{font-size:25px}
  .grid2,.grid3{grid-template-columns:1fr}
  .brief-cards{grid-template-columns:1fr 1fr;gap:10px}
  .money-top,.fit-top{grid-template-columns:1fr 1fr;gap:10px}
  .stat .v{font-size:21px}
  .bcard .v{font-size:20px}
  .daystrip{gap:4px}
  .dcell{padding:7px 2px}
  .dcell .d{font-size:14px}
  .dcell .w{font-size:9px}
  .cmp{height:96px}
  .fitgrid{grid-template-columns:1fr 1fr;gap:10px}
  .toolbar{gap:6px}
  .toolbar .grow{min-width:100%}
  .tx{grid-template-columns:24px minmax(0,1fr) auto;gap:9px}
  .vw-switch{display:none}
  .yearstat{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
@media print{.rail,.tabbar,.topbar .right{display:none}}

};

/* ============================================================
   1. 工具
   ============================================================ */
var $ = function(s, r){ return (r||document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html!=null) e.innerHTML = html; return e; }
function p2(n){ return (n<10?'0':'') + n; }
function dkey(d){
  d = d || new Date();
  return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate());
}
function parseKey(k){ var a = String(k).split('-'); return new Date(+a[0], +a[1]-1, +a[2]); }
function addDays(k, n){ var d = parseKey(k); d.setDate(d.getDate()+n); return dkey(d); }
function diffDays(a, b){ return Math.round((parseKey(b) - parseKey(a)) / 86400000); }
function ym(k){ return String(k).slice(0,7); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function clamp(n, a, b){ return Math.max(a, Math.min(b, n)); }
function num(v, d){ var n = parseFloat(v); return (isFinite(n) ? n : (d===undefined?0:d)); }
function round(n, p){ var m = Math.pow(10, p||0); return Math.round(n*m)/m; }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function attr(s){ return esc(s); }
function money(n, dec){
  if(n==null || !isFinite(n)) n = 0;
  var neg = n < 0; n = Math.abs(n);
  var s = (dec===undefined ? 2 : dec);
  var v = n.toFixed(s);
  var p = v.split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return (neg?'-':'') + p.join('.');
}
function kmoney(n){
  if(Math.abs(n) >= 10000) return round(n/10000, 2) + '万';
  return money(n, 0);
}
var WD = ['周日','周一','周二','周三','周四','周五','周六'];
function prettyDate(k){
  var d = parseKey(k), t = dkey();
  if(k === t) return '今天';
  if(k === addDays(t,-1)) return '昨天';
  if(k === addDays(t,1)) return '明天';
  return (d.getMonth()+1) + '月' + d.getDate() + '日 ' + WD[d.getDay()];
}
function relTime(ts){
  var s = Math.floor((Date.now()-ts)/1000);
  if(s < 60) return '刚刚';
  if(s < 3600) return Math.floor(s/60) + ' 分钟前';
  if(s < 86400) return Math.floor(s/3600) + ' 小时前';
  if(s < 86400*7) return Math.floor(s/86400) + ' 天前';
  return dkey(new Date(ts)).slice(5);
}
function hashHue(s){
  s = String(s||''); var h = 0;
  for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) % 360;
  return h;
}

  var h = hashHue(name);
  return 'hsl(' + h + ', 34%, 46%)';

  var t; return function(){ var a = arguments, c = this; clearTimeout(t); t = setTimeout(function(){ fn.apply(c,a); }, ms); };

/* ============================================================

   ============================================================ */
var KEY = 'lifedesk.v1';
var KEY_BAK = 'lifedesk.v1.bak';
var KEY_BAD = 'lifedesk.v1.corrupt';
var SCHEMA = 1;
var DB = null;
var storageOK = true;
var lastBakAt = 0;
var pendingSave = null;

var CATS_EXP = ['餐饮','交通','居家','购物','娱乐','医疗','学习','人情','其他'];
var CATS_INC = ['工资','副业','理财','红包','报销','其他'];
var PRI = { 1:{n:'很想要',c:'p1'}, 2:{n:'想要',c:'p2'}, 3:{n:'再看看',c:'p3'} };
var MSTATUS = { want:'想看', doing:'在看', done:'看完' };
var MTYPE = { book:'书', movie:'影', music:'音' };

function blank(){
  return {
    v: SCHEMA,
    createdAt: Date.now(),
    meta: { addSinceBackup: 0, lastBackup: null, demo: false },
    profile: { height: 170, targetWeight: 62, targetFat: 18, budget: 5000, kcalTarget: 1800, name: '' },
    tx: [], budgets: {}, habits: [],
    fitness: { logs: [], energy: [], plan: [], done: {} },
    schedule: [], wants: [], media: []
  };
}

function merge(o, d){
  if(o === null || o === undefined) return d;
  if(typeof d !== 'object' || d === null || Array.isArray(d)) {
    return (typeof o === typeof d || d === null) ? (o === undefined ? d : o) : d;
  }
  if(typeof o !== 'object' || o === null || Array.isArray(o)) return d;
  var r = {};
  for(var k in d){
    if(!Object.prototype.hasOwnProperty.call(d,k)) continue;
    r[k] = merge(o[k], d[k]);
  }
  return r;
}
function isArray(v){ return Object.prototype.toString.call(v) === '[object Array]'; }
function validate(d){
  if(!d || typeof d !== 'object') return '数据不是有效对象';
  if(!isArray(d.tx) || !isArray(d.habits) || !isArray(d.schedule) || !isArray(d.wants) || !isArray(d.media)) return '关键字段缺失或类型错误';
  if(!d.fitness || typeof d.fitness !== 'object') return '健身数据结构异常';
  if(!isArray(d.fitness.logs) || !isArray(d.fitness.energy) || !isArray(d.fitness.plan)) return '健身数据结构异常';
  return null;
}

function normalize(d){
  var b = blank();
  var out = {
    v: SCHEMA,
    createdAt: num(d.createdAt, Date.now()),
    meta: merge(d.meta || {}, b.meta),
    profile: merge(d.profile || {}, b.profile),
    tx: isArray(d.tx) ? d.tx.filter(function(x){ return x && x.date; }).map(function(x){
      return { id: x.id || uid(), date: String(x.date).slice(0,10), type: x.type === 'income' ? 'income' : 'expense',
               amount: num(x.amount), cat: String(x.cat || '其他'), note: String(x.note || ''), ts: num(x.ts, Date.now()),
               demo: !!x.demo };
    }) : [],
    budgets: (d.budgets && typeof d.budgets === 'object' && !isArray(d.budgets)) ? d.budgets : {},
    habits: isArray(d.habits) ? d.habits.filter(function(x){ return x && x.name; }).map(function(x){
      return { id: x.id || uid(), name: String(x.name), emoji: String(x.emoji || '·'),
               type: (['check','count','value'].indexOf(x.type) >= 0) ? x.type : 'check',
               unit: String(x.unit || ''), target: num(x.target, 1) || 1,
               logs: (x.logs && typeof x.logs === 'object' && !isArray(x.logs)) ? x.logs : {},
               createdAt: num(x.createdAt, Date.now()), demo: !!x.demo };
    }) : [],
    fitness: {
      logs: isArray(d.fitness && d.fitness.logs) ? d.fitness.logs.filter(function(x){ return x && x.date; }).map(function(x){
        return { date: String(x.date).slice(0,10), w: num(x.w) || null, f: (x.f === null || x.f === undefined) ? null : (num(x.f) || null), demo: !!x.demo };
      }) : [],
      energy: isArray(d.fitness && d.fitness.energy) ? d.fitness.energy.filter(function(x){ return x && x.date; }).map(function(x){
        return { date: String(x.date).slice(0,10), in: num(x.in), out: num(x.out) };
      }) : [],
      plan: isArray(d.fitness && d.fitness.plan) ? d.fitness.plan.map(function(x){
        return { id: x.id || uid(), day: clamp(num(x.day,0),0,6), name: String(x.name || '训练') };
      }) : [],
      done: (d.fitness && d.fitness.done && !isArray(d.fitness.done)) ? d.fitness.done : {}
    },
    schedule: isArray(d.schedule) ? d.schedule.filter(function(x){ return x && x.date; }).map(function(x){
      return { id: x.id || uid(), date: String(x.date).slice(0,10), time: x.time ? String(x.time).slice(0,5) : '',
               title: String(x.title || '未命名'), note: String(x.note || ''), tag: String(x.tag || '其他'),
               done: !!x.done, allday: !!x.allday, demo: !!x.demo };
    }) : [],
    wants: isArray(d.wants) ? d.wants.filter(function(x){ return x && x.name; }).map(function(x){
      return { id: x.id || uid(), name: String(x.name), price: num(x.price), pri: clamp(num(x.pri,2),1,3),

               createdAt: num(x.createdAt, Date.now()), demo: !!x.demo };
    }) : [],
    media: isArray(d.media) ? d.media.filter(function(x){ return x && x.title; }).map(function(x){
      return { id: x.id || uid(), type: (['book','movie','music'].indexOf(x.type) >= 0) ? x.type : 'book',
               title: String(x.title), author: String(x.author || ''), status: ['want','doing','done'].indexOf(x.status) >= 0 ? x.status : 'want',
               rating: clamp(num(x.rating,0),0,5), comment: String(x.comment || ''), cover: String(x.cover || ''),
               year: num(x.year, new Date().getFullYear()), createdAt: num(x.createdAt, Date.now()),
               doneAt: x.doneAt ? num(x.doneAt, Date.now()) : null, demo: !!x.demo };
    }) : []
  };
  for(var k in b.meta) if(out.meta[k] === undefined) out.meta[k] = b.meta[k];
  return out;
}

function loadDB(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); }
  catch(e){
    storageOK = false;
    DB = seedDemo(blank()); DB.meta.demo = true;
    bannerWarn('无法访问本地存储', '浏览器可能处于隐私模式或禁用了存储，本次改动不会被保存。请导出 JSON 备份以免数据丢失。');
    return DB;
  }
  if(!raw){ DB = seedDemo(blank()); DB.meta.demo = true; saveNow(true); return DB; }
  var parsed = null, err = null;
  try { parsed = JSON.parse(raw); } catch(e){ err = '解析失败：' + e.message; }
  if(!err) err = validate(parsed);
  if(err){
    // 保留损坏原文，尝试从自动备份恢复
    try { localStorage.setItem(KEY_BAD, raw); } catch(e2){}
    var recovered = null;
    var bak = null;
    try { bak = localStorage.getItem(KEY_BAK); } catch(e3){}
    if(bak){
      try {
        var bp = JSON.parse(bak);
        if(!validate(bp)) recovered = normalize(bp);
      } catch(e4){}
    }
    if(recovered){
      DB = recovered;

      var prev = null;
      try { prev = localStorage.getItem(KEY); } catch(e){}
      if(prev && prev.length > 20){ try { localStorage.setItem(KEY_BAK, prev); lastBakAt = now; } catch(e){} }
    }
    localStorage.setItem(KEY, s);

  } catch(e){

    var quota = (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014));
    toast(quota ? '存储空间已满，保存失败' : '保存失败：' + (e && e.message ? e.message : '未知错误'), 'err');
    bannerErr('数据未能写入浏览器存储',

function monthTx(m){
  return DB.tx.filter(function(x){ return ym(x.date) === m; });
}
function sumBy(list, type){
  return list.reduce(function(s,x){ return s + (x.type === type ? num(x.amount) : 0); }, 0);
}
function monthStats(m){
  var list = monthTx(m);
  var inc = sumBy(list, 'income'), exp = sumBy(list, 'expense');
  var days = new Date(parseInt(m.slice(0,4),10), parseInt(m.slice(5,7),10), 0).getDate();
  var todayM = ym(dkey());
  var elapsed = (m === todayM) ? new Date().getDate() : days;
  return { m:m, inc:inc, exp:exp, net:inc-exp, count:list.length, days:days,
           elapsed:elapsed, avgDay: exp / Math.max(1,elapsed), avgMonth: exp / Math.max(1,elapsed) * days,
           rate: inc > 0 ? (inc-exp)/inc : (exp>0 ? -1 : 0) };
}
function prevMonths(m, n){
  var y = parseInt(m.slice(0,4),10), mo = parseInt(m.slice(5,7),10);
  var out = [];
  for(var i=n-1;i>=0;i--){
    var d = new Date(y, mo-1-i, 1);
    out.push(d.getFullYear() + '-' + p2(d.getMonth()+1));
  }
  return out;
}
function catBreak(m, type){
  var list = monthTx(m).filter(function(x){ return x.type === (type||'expense'); });
  var map = {};
  list.forEach(function(x){ map[x.cat] = (map[x.cat]||0) + num(x.amount); });
  var total = list.reduce(function(s,x){ return s+num(x.amount); }, 0);
  return Object.keys(map).map(function(k){
    return { cat:k, v:map[k], p: total ? map[k]/total : 0, n: list.filter(function(x){return x.cat===k;}).length, color:catColor(k) };
  }).sort(function(a,b){ return b.v - a.v; });
}
function budgetOf(m){
  if(DB.budgets[m]) return DB.budgets[m];
  var keys = Object.keys(DB.budgets).sort();
  var src = null;
  for(var i=0;i<keys.length;i++) if(keys[i] < m) src = DB.budgets[keys[i]];
  if(src) return JSON.parse(JSON.stringify(src));

function habitStreak(h){
  var n = 0, k = dkey();

}
function habitBest(h){
  var keys = Object.keys(h.logs || {}).filter(function(k){ return habitDone(h, k); }).sort();
  var best = 0, run = 0, prev = null;
  keys.forEach(function(k){

}
function habitRate(h, days){

  var used = bud.total > 0 ? ms.exp / bud.total : 0;
  dims.push({ k:'预算节奏', v: clamp(1 - Math.max(0, used - ms.elapsed/ms.days) * 2.2, 0, 1),
              d: '本月已用 ' + Math.round(used*100) + '%，时间过去 ' + Math.round(ms.elapsed/ms.days*100) + '%' });
  // 习惯
  var hr = DB.habits.length ? DB.habits.reduce(function(s,h){ return s + habitRate(h, 14); }, 0) / DB.habits.length : null;
  dims.push({ k:'习惯坚持', v: hr, d: DB.habits.length ? DB.habits.length + ' 个习惯，近两周完成率 ' + Math.round((hr||0)*100) + '%' : '还没有习惯，先加一个' });
  // 训练
  var p = planFor(parseKey(t).getDay()), done = DB.fitness.done[t] || [];
  var pv = !p.length ? null : (done.length ? clamp(done.length / p.length, 0, 1) : 0);
  dims.push({ k:'今日训练', v: pv, d: !p.length ? '今天没有安排训练' : (done.length ? '已完成 ' + done.length + '/' + p.length + ' 项' : p.length + ' 项待完成') });
  // 日程
  var sd = scheduleOf(t);
  var sv = sd.length ? sd.filter(function(x){return x.done;}).length / sd.length : null;
  dims.push({ k:'日程推进', v: sv, d: sd.length ? '完成 ' + sd.filter(function(x){return x.done;}).length + '/' + sd.length + ' 项' : '今天没有日程' });
  // 饮水/健康（取数值型习惯）
  var hv = null;
  var vh = DB.habits.filter(function(h){ return h.type !== 'check'; });
  if(vh.length){ hv = vh.reduce(function(s,h){ return s + clamp(habitLog(h,t)/Math.max(1,num(h.target,1)),0,1); },0)/vh.length; }
  dims.push({ k:'身体指标', v: hv, d: vh.length ? '计数与数值类目标进度' : '暂无量化目标' });

  var valid = dims.filter(function(d){ return d.v !== null; });
  var score = valid.length ? Math.round(valid.reduce(function(s,d){ return s + d.v; }, 0) / valid.length * 100) : null;
  return { score: score, dims: dims, ms: ms, bud: bud };
}
function scoreWord(s){
  if(s === null) return { w:'开始记录吧', c:'' };
  if(s >= 85) return { w:'状态很好', c:'pos' };
  if(s >= 70) return { w:'稳步向前', c:'pos' };
  if(s >= 50) return { w:'还可以更好', c:'warn' };
  return { w:'需要一点调整', c:'neg' };
}

function download(name, text, mime){
  try {
    var blob = new Blob([text], { type: (mime||'application/json') + ';charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); URL.revokeObjectURL(url); }, 400);
    return true;
  } catch(e){
    toast('下载失败：' + e.message, 'err');
    return false;
  }
}
function backupName(ext){

  return '生活工作台备份-' + d.getFullYear() + p2(d.getMonth()+1) + p2(d.getDate()) + '-' + p2(d.getHours()) + p2(d.getMinutes()) + '.' + (ext||'json');
}

    DB.fitness.logs.length + DB.fitness.energy.length + DB.fitness.plan.length;

function importJSON(text, mode){
  var parsed = null;
  try { parsed = JSON.parse(text); }
  catch(e){ return { ok:false, msg:'文件不是有效的 JSON：' + e.message }; }
  var err = validate(parsed);
  if(err) return { ok:false, msg:'数据结构不通过校验（' + err + '）。请确认选择的是本工作台导出的备份文件。' };
  var inc = normalize(parsed);
  if(mode === 'replace'){
    DB = inc;
    DB.meta.addSinceBackup = 0;
    DB.meta.demo = false;
    saveNow(true);
    render();
    return { ok:true, msg:'已整体替换，当前共 ' + totalRecords() + ' 条记录' };
  }
  // 合并：按 id 去重，新数据优先
  var stats = { tx:0, habits:0, schedule:0, wants:0, media:0, logs:0, energy:0, plan:0 };
  function mergeList(key, sub){
    var seen = {};
    DB[key].forEach(function(x){ seen[x.id] = true; });
    inc[key].forEach(function(x){
      if(seen[x.id]) return;
      seen[x.id] = true; DB[key].push(x); stats[sub]++;
    });
  }
  mergeList('tx','tx'); mergeList('habits','habits'); mergeList('schedule','schedule');
  mergeList('wants','wants'); mergeList('media','media');
  // habits 内嵌 logs 合并
  DB.habits.forEach(function(h){
    var src = inc.habits.filter(function(x){ return x.id === h.id; })[0];
    if(src && src.logs){
      for(var k in src.logs){ if(!h.logs[k]) { h.logs[k] = src.logs[k]; stats.logs++; } }
    }
  });
  // fitness logs 按日期合并
  var dseen = {};
  DB.fitness.logs.forEach(function(x){ dseen[x.date] = true; });
  inc.fitness.logs.forEach(function(x){ if(!dseen[x.date]){ DB.fitness.logs.push(x); dseen[x.date]=true; stats.logs++; } });
  var eseen = {};
  DB.fitness.energy.forEach(function(x){ eseen[x.date] = true; });
  inc.fitness.energy.forEach(function(x){ if(!eseen[x.date]){ DB.fitness.energy.push(x); eseen[x.date]=true; stats.energy++; } });
  var pseen = {};
  DB.fitness.plan.forEach(function(x){ pseen[x.id] = true; });
  inc.fitness.plan.forEach(function(x){ if(!pseen[x.id]){ DB.fitness.plan.push(x); pseen[x.id]=true; stats.plan++; } });
  for(var k2 in inc.fitness.done){ if(!DB.fitness.done[k2]) DB.fitness.done[k2] = inc.fitness.done[k2]; }
  // 预算与档案：仅在本地缺失时补充
  for(var m in inc.budgets){ if(!DB.budgets[m]) DB.budgets[m] = inc.budgets[m]; }
  ['height','targetWeight','targetFat','budget','kcalTarget'].forEach(function(p){
    if(!num(DB.profile[p], 0) && num(inc.profile[p], 0)) DB.profile[p] = inc.profile[p];
  });
  DB.meta.demo = false;
  saveNow(true);
  render();
  var added = stats.tx + stats.habits + stats.schedule + stats.wants + stats.media + stats.logs + stats.energy + stats.plan;
  return { ok:true, msg:'导入完成，新增 ' + added + ' 条（重复记录已自动跳过）' };
}

  var r = new FileReader();
  r.onload = function(){ cb(r.result); };
  r.onerror = function(){ toast('读取文件失败', 'err'); };
  r.readAsText(file, 'utf-8');
}

/* --- 账目导出：真 .xlsx（内置 ZIP，无外部依赖；失败自动降级 CSV） --- */
var CRC_T = (function(){
  var t = new Uint32Array(256);
  for(var i=0;i<256;i++){
    var c = i;
    for(var j=0;j<8;j++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(buf){
  var c = 0xFFFFFFFF;
  for(var i=0;i<buf.length;i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function strBytes(s){ return new TextEncoder().encode(s); }
function zipStore(files){
  // files: [{name, data:Uint8Array}]
  var parts = [], central = [], offset = 0;
  var t = new Date();
  var dosTime = ((t.getHours() << 11) | (t.getMinutes() << 5) | (Math.floor(t.getSeconds()/2))) & 0xFFFF;
  var dosDate = (((t.getFullYear()-1980) << 9) | ((t.getMonth()+1) << 5) | t.getDate()) & 0xFFFF;
  files.forEach(function(f){
    var nm = strBytes(f.name), crc = crc32(f.data);
    var lh = new Uint8Array(30 + nm.length);
    var dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, dosTime, true); dv.setUint16(12, dosDate, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, f.data.length, true); dv.setUint32(22, f.data.length, true);
    dv.setUint16(26, nm.length, true); dv.setUint16(28, 0, true);
    lh.set(nm, 30);
    parts.push(lh, f.data);

    var ch = new Uint8Array(46 + nm.length);
    var cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true); cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true); cv.setUint32(20, f.data.length, true); cv.setUint32(24, f.data.length, true);
    cv.setUint16(28, nm.length, true); cv.setUint16(30, 0, true); cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true); cv.setUint16(36, 0, true); cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(nm, 46);
    central.push(ch);
    offset += lh.length + f.data.length;
  });
  var cdSize = central.reduce(function(s,c){ return s + c.length; }, 0);
  var eocd = new Uint8Array(22);
  var ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(4, 0, true); ev.setUint16(6, 0, true);
  ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, offset, true); ev.setUint16(20, 0, true);
  var all = parts.concat(central, [eocd]);
  var total = all.reduce(function(s,p){ return s + p.length; }, 0);
  var out = new Uint8Array(total), pos = 0;
  all.forEach(function(p){ out.set(p, pos); pos += p.length; });
  return out;
}
function xcol(n){ // 1 -> A
  var s = '';
  while(n > 0){ var r = (n-1) % 26; s = String.fromCharCode(65 + r) + s; n = Math.floor((n-1)/26); }
  return s;
}
function xesc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
function sheetXml(rows, opts){
  opts = opts || {};
  var widths = opts.widths || [];
  var s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  if(widths.length){
    s += '<cols>';
    widths.forEach(function(wc, i){ s += '<col min="' + (i+1) + '" max="' + (i+1) + '" width="' + wc + '" customWidth="1"/>'; });
    s += '</cols>';
  }
  s += '<sheetData>';
  rows.forEach(function(row, ri){
    s += '<row r="' + (ri+1) + '">';
    row.forEach(function(cell, ci){
      if(cell === null || cell === undefined || cell === '') return;
      var ref = xcol(ci+1) + (ri+1);
      var st = (ri === 0 || (opts.boldRows && opts.boldRows.indexOf(ri) >= 0)) ? ' s="1"' : '';
      if(typeof cell === 'number' && isFinite(cell)){
        s += '<c r="' + ref + '"' + st + '><v>' + cell + '</v></c>';
      } else {
        s += '<c r="' + ref + '"' + st + ' t="inlineStr"><is><t xml:space="preserve">' + xesc(cell) + '</t></is></c>';
      }
    });
    s += '</row>';
  });
  s += '</sheetData></worksheet>';
  return s;
}
function buildXlsx(sheets){
  var N = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
  sheets.forEach(function(sh, i){ ct += '<Override PartName="/xl/worksheets/sheet' + (i+1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'; });
  ct += '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>';

  var rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +

function ring(size, pct, stroke){
  var r = (size - 9) / 2, c = 2 * Math.PI * r;
  var off = c * (1 - clamp(pct, 0, 1));
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '">' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="rgba(242,238,232,.18)" stroke-width="6"/>' +
    '<circle cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" fill="none" stroke="' + (stroke||'#E2A48D') + '" stroke-width="6" stroke-linecap="round" ' +
    'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" style="transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)"/></svg>';
}
function sparkline(vals, w, h){
  var pts = vals.filter(function(v){ return v != null; });
  if(pts.length < 2) return '';
  var min = Math.min.apply(null, pts), max = Math.max.apply(null, pts);
  var span = (max - min) || 1;
  var step = vals.length > 1 ? w / (vals.length-1) : w;
  var d = '', started = false;
  vals.forEach(function(v, i){
    if(v == null) return;
    var x = i * step, y = h - ((v - min) / span) * (h - 4) - 2;
    d += (started ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1) + ' ';
    started = true;
  });
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="display:block">' +
    '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

  h += '<div class="panel"><div class="ptitle"><div class="l"><h3>近 14 天支出</h3><span class="hint">日均 ' + money(ms.avgDay,0) + '</span></div>' +

  var mx = Math.max.apply(null, days14.map(function(d){ return d.v; })) || 1;

  days14.forEach(function(d){
    h += '<div class="col" title="' + d.k + ' · ' + money(d.v) + ' 元"><div class="bars">' +
      '<div class="b o" style="height:' + Math.max(2, (d.v/mx)*100) + '%;width:100%;max-width:12px"></div></div>' +
      '<div class="lb">' + (+d.k.slice(8)) + '</div></div>';
